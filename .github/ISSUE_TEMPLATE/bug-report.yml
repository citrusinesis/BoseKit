name: Bug report
description: Report something that does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Include any error message shown in BoseKit.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Select a listening mode
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Bose model and firmware
      placeholder: "QuietComfort Ultra Headphones (1st Gen), 1.6.7"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: bosekit
    attributes:
      label: BoseKit version or commit
      placeholder: "main @ 35a6e80"
    validations:
      required: true

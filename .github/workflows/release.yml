name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Draft release
    # project.xcproj is the JSON project format introduced in Xcode 27.2; older Xcode cannot open it.
    runs-on: xcode-27
    env:
      XCODE_APP: /Applications/Xcode_27.2.app
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.2
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not installed on this runner. Installed versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Test
        run: >
          xcodebuild test
          -workspace BoseKit.xcworkspace
          -scheme BoseKit
          -destination 'platform=macOS'
          -skip-testing:BoseKitUITests
          CODE_SIGN_IDENTITY=-
      - name: Build disk image
        run: scripts/build-dmg.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      # The release stays a draft until someone has downloaded the image and opened it, because the app is not notarized.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="build/BoseKit-$version.dmg"
          checksum="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          gh release create "$GITHUB_REF_NAME" "$dmg" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "BoseKit $version" \
            --generate-notes \
            --notes "SHA-256: $checksum"
